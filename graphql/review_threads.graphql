fragment ThreadCommentFields on PullRequestReviewCommentConnection {
  nodes {
    body
    diffHunk
    originalPosition
    position
    path
    url
    author {
      __typename
      login
    }
  }
  pageInfo {
    hasNextPage
    endCursor
  }
}

query ThreadsQuery($owner: String!, $name: String!, $number: Int!, $cursor: String) {
  repository(owner: $owner, name: $name) {
    pullRequest(number: $number) {
      reviewThreads(first: 100, after: $cursor) {
        nodes {
          id
          isResolved
          isOutdated
          comments(first: 100) {
            ...ThreadCommentFields
          }
        }
        pageInfo {
          hasNextPage
          endCursor
        }
      }
    }
  }
}

query CommentQuery($id: ID!, $cursor: String) {
  node(id: $id) {
    __typename
    ... on PullRequestReviewThread {
      comments(first: 100, after: $cursor) {
        ...ThreadCommentFields
      }
    }
  }
}
