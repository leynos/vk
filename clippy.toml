# Cognitive complexity is not gated by Clippy: it scores code after macro
# expansion, so it counts branching a macro generated. Whitaker's
# `macro_aware_cognitive_complexity` gates it at 12 (see `dylint.toml`).

# `CodeScene` is a proper noun, not a code item. `doc_markdown` cannot tell
# the two apart, and backticking a company name through every line of prose
# that mentions it makes the documentation worse to read. `".."` extends
# clippy's own list rather than replacing it, so the default identifiers are
# still recognised.
doc-valid-idents = ["CodeScene", ".."]

disallowed-methods = [
  { path = "std::env::set_var", reason = "use an injected environment in tests" },
  { path = "std::env::remove_var", reason = "use an injected environment in tests" },
  { path = "std::env::set_current_dir", reason = "process-wide working directory; pass the directory in or use Command::current_dir" },
]
