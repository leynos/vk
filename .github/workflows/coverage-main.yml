name: Coverage (main)

# Main owns every persistent coverage output: the CodeScene upload and
# the ratchet baseline. Pull requests generate coverage only for their
# own ratchet check; they neither publish the report nor contact
# CodeScene at all. Caches saved on main are readable by every
# pull-request run, so the baseline written here is the one those
# ratchet checks compare against.
#
# Two reasons the split is this way round rather than a preference.
# CodeScene accepts `cs-coverage upload` only for branches it analyses,
# so an upload from a pull-request head fails outright. And a
# pull-request lane that contacts CodeScene puts a third-party network
# call, and the token that authenticates it, on the fork-facing side of
# the repository.
#
# workflow_dispatch lets the upload be re-run on demand: merges
# performed by the automerge workflow's GITHUB_TOKEN do not fire
# push-event workflows, so automerged changes to main only get coverage
# via a manual dispatch.

on:
  push:
    branches: [main]
  workflow_dispatch:

# Queue rather than cancel. A cancelled run abandons both its upload and the
# ratchet baseline it writes; a queued one publishes after the run ahead of
# it, so the latest push's baseline is the one that stands.
concurrency:
  group: coverage-main-${{ github.ref }}
  cancel-in-progress: false

# The workflow token reads the repository and nothing more. No step here
# writes to GitHub, and the shared actions pass `github.token` on to
# installers, so a wider default would be exposed to them for no use.
permissions:
  contents: read

jobs:
  coverage-upload:
    runs-on: ubicloud-standard-2
    timeout-minutes: 20
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v7
      - name: Setup Rust
        uses: leynos/shared-actions/.github/actions/setup-rust@95e90ba9e33eaeb3c8b4bf6ed1dbe1d7184ee710
      - name: Generate coverage
        uses: leynos/shared-actions/.github/actions/generate-coverage@95e90ba9e33eaeb3c8b4bf6ed1dbe1d7184ee710
        with:
          output-path: lcov.info
          format: lcov
          use-cargo-nextest: 'false'
          with-ratchet: 'true'
      # Publishes whether the token exists, and nothing else. The token is
      # in no `env` on this workflow: a job-level secret is exported into
      # every step's environment, this repository's own build among them,
      # and the upload is a composite action whose nested steps inherit the
      # calling step's `env`, so even a step-level binding reached every one
      # of them. GitHub evaluates the expression before it sends the command
      # to the runner, so the shell receives only `true` or `false`: the
      # token is in neither the check's command nor its environment.
      - name: Check CodeScene token availability
        id: codescene_token
        run: echo "available=${{ secrets.CS_ACCESS_TOKEN != '' }}" >> "$GITHUB_OUTPUT"
      - name: Upload coverage data to CodeScene
        # Two guards, and neither may be widened with `||`. The ref guard is
        # needed as well as the trigger's branch filter because
        # workflow_dispatch runs against whichever branch the dispatcher
        # picks, and CodeScene refuses coverage for a branch it does not
        # analyse.
        if: steps.codescene_token.outputs.available == 'true' && github.ref == 'refs/heads/main'
        uses: leynos/shared-actions/.github/actions/upload-codescene-coverage@a5765019912a8ab6882b12db049c7cde635f3a85
        with:
          format: lcov
          # Explicit rather than left to the action's default, so the mode
          # this lane runs in is readable here and assertable by the
          # contract. "upload" is what an analysed branch does; "check" is
          # the pull-request gate this repository no longer runs.
          mode: upload
          access-token: ${{ secrets.CS_ACCESS_TOKEN }}
