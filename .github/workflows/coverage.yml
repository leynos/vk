name: CI

on:
  pull_request:
    branches: [main]

jobs:
  build-test:
    runs-on: ubuntu-latest
    env:
      CARGO_TERM_COLOR: always
      CS_ACCESS_TOKEN: ${{ secrets.CS_ACCESS_TOKEN }}
      CODESCENE_CLI_SHA256: ${{ vars.CODESCENE_CLI_SHA256 }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Setup Rust
        uses: leynos/shared-actions/.github/actions/setup-rust@1014f0ce1621506ca5fa66b596ed88ec30774cce
      - name: Format
        run: make check-fmt
      - name: Lint
        run: make lint
      - name: Generate coverage
        uses: leynos/shared-actions/.github/actions/generate-coverage@1014f0ce1621506ca5fa66b596ed88ec30774cce
        with:
          output-path: lcov.info
          format: lcov
          use-cargo-nextest: 'false'
          with-ratchet: 'true'
      # `cs-coverage upload` is not run here: CodeScene only accepts
      # uploads for branches it analyses (main), so uploading from a
      # pull-request head fails; main-branch coverage is uploaded by
      # coverage-main.yml instead.
      - name: Check coverage against CodeScene gates
        env:
          CS_ACCESS_TOKEN: ${{ secrets.CS_ACCESS_TOKEN }}
        if: env.CS_ACCESS_TOKEN != '' && github.event_name == 'pull_request'
        uses: leynos/shared-actions/.github/actions/upload-codescene-coverage@1014f0ce1621506ca5fa66b596ed88ec30774cce
        with:
          format: lcov
          mode: check
          project-url: https://api.codescene.io/v2/projects/70277
          access-token: ${{ env.CS_ACCESS_TOKEN }}
          installer-checksum: ${{ vars.CODESCENE_CLI_SHA256 }}

  # Exercise the experimental REST-based resolve path, ensuring lints and tests
  # pass when the `unstable-rest-resolve` feature is enabled.
  unstable-rest-resolve:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Setup Rust
        uses: leynos/shared-actions/.github/actions/setup-rust@1014f0ce1621506ca5fa66b596ed88ec30774cce
      - name: Install OpenSSL
        run: sudo apt-get update && sudo apt-get install -y openssl ca-certificates
      - name: Lint (feature-gated)
        run: CARGO="cargo --locked" make lint CLIPPY_FLAGS="--all-targets --features unstable-rest-resolve -- -D warnings"
      - name: Test unstable REST resolve (feature-gated)
        run: RUSTFLAGS="-D warnings" CARGO="cargo --locked" make test
