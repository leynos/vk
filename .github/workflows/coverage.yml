name: CI

on:
  pull_request:
    branches: [main]

# A second push to a pull request supersedes the run already in flight, which
# otherwise charges a full set of minutes for a result nobody reads. This
# workflow starts on pull requests alone today; the guard is on the event and
# not a literal `true` so that adding a push or a dispatch trigger later cannot
# silently start cancelling the runs that write the record.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# The workflow token reads the repository and nothing more. No step here
# writes to GitHub, and the shared actions pass `github.token` on to
# installers, so a wider default would be exposed to them for no use.
permissions:
  contents: read

jobs:
  build-test:
    runs-on: >-
      ${{ github.event.pull_request.head.repo.fork
      && 'ubuntu-latest' || 'ubicloud-standard-2' }}
    timeout-minutes: 25
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Setup Rust
        uses: leynos/shared-actions/.github/actions/setup-rust@95e90ba9e33eaeb3c8b4bf6ed1dbe1d7184ee710
      - name: Install mdtablefix
        # `make check-fmt` runs `mdtablefix --check --git`; 0.6.0 is the
        # first release with `--check` and `--git`.
        uses: leynos/shared-actions/.github/actions/install-mdtablefix@c5a54701c8603a0fa756a6b34c49bc2af75a6c11
        with:
          version: "0.6.0"

      - name: Format
        run: make check-fmt

      - name: Lint Markdown
        # The upstream action rather than an installation of our own: its
        # release carries the linter's whole dependency graph, so nothing is
        # resolved from the registry at run time, and Dependabot manages the
        # pin alongside the other actions. It reads .markdownlint-cli2.jsonc
        # from the workspace, so the rules and ignores match `make markdownlint`.
        uses: DavidAnson/markdownlint-cli2-action@21c1be1b93ad9ed58fa840aacc3f279cde2a72ff  # v24.2.0
        with:
          globs: '**/*.md'
      - name: Lint
        run: make lint
      - name: Generate coverage
        uses: leynos/shared-actions/.github/actions/generate-coverage@95e90ba9e33eaeb3c8b4bf6ed1dbe1d7184ee710
        with:
          output-path: lcov.info
          format: lcov
          use-cargo-nextest: 'false'
          with-ratchet: 'true'
      # Nothing contacts CodeScene here. This lane generates coverage for
      # its own ratchet check and stops; `coverage-main.yml` owns every
      # persistent coverage output, the upload included. See "Coverage:
      # what each lane owns" in the developers' guide.

  # Exercise the experimental REST-based resolve path, ensuring lints and tests
  # pass when the `unstable-rest-resolve` feature is enabled.
  unstable-rest-resolve:
    runs-on: >-
      ${{ github.event.pull_request.head.repo.fork
      && 'ubuntu-latest' || 'ubicloud-standard-2' }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - name: Setup Rust
        uses: leynos/shared-actions/.github/actions/setup-rust@95e90ba9e33eaeb3c8b4bf6ed1dbe1d7184ee710
      - name: Install OpenSSL
        run: sudo apt-get update && sudo apt-get install -y openssl ca-certificates
      - name: Lint (feature-gated)
        run: CARGO="cargo --locked" make lint CLIPPY_FLAGS="--all-targets --features unstable-rest-resolve -- -D warnings"
      - name: Test unstable REST resolve (feature-gated)
        run: RUSTFLAGS="-D warnings" CARGO="cargo --locked" make test
