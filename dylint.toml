# Whitaker (Dylint) configuration for the workspace.
#
# `macro_aware_cognitive_complexity` replaces Clippy's `cognitive_complexity`.
# It skips branching a macro generated and holds the ceiling Clippy's lint held
# here, 12. It is experimental, so the suite loads it only on request. The
# tracker is https://github.com/leynos/whitaker/issues/504.
[whitaker]
experimental = ["macro_aware_cognitive_complexity"]

[macro_aware_cognitive_complexity]
max_complexity = 12
